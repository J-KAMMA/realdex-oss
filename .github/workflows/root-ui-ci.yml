name: Root UI regression (no deployment)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/root-ui-ci.yml'
permissions:
  contents: read
concurrency:
  group: root-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  root-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install exact package manager and frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build the full root before UI tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build 2>&1 | tee root-build-ci.log
      - name: Full root UI regression with original assertions
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:ui 2>&1 | tee root-ui-ci.log
      - name: Retain test diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            root-ui-ci.log
            root-build-ci.log
          if-no-files-found: error
          retention-days: 14
# No public RPC, deployment, wallet secrets or approval mutation.
